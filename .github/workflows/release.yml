name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: La version du tag correspond au package
        run: test "v$(node -p "require('./packages/nohu-cms/package.json').version")" = "$GITHUB_REF_NAME"
      # Publication sans jeton (Trusted Publisher npm, OIDC) : la version est
      # déposée en attente, puis validée avec la 2FA sur npmjs.com
      # (Staged Packages) ou par `npm stage approve <id>`.
      - run: npm install -g npm@11.21.1
      - run: npm stage publish --workspace nohu-cms --provenance --access public
